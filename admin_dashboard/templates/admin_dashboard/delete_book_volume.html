{% extends 'admin_dashboard/base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2>Delete Book Volume</h2>
    <p>Are you sure you want to delete the volume "{{ object }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'admin_dashboard:book_volume_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
