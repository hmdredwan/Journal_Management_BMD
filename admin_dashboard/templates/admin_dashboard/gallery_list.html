{% extends 'admin_dashboard/base.html' %}
{% block content %}
<h2>Gallery Images</h2>
<a href="{% url 'upload_gallery' %}" class="btn btn-success mb-3">Upload Gallery</a>
<div class="row">
    {% for image in gallery %}
    <div class="col-md-3 mb-3">
        <div class="card">
            <img src="{{ image.image.url }}" class="card-img-top" style="width: 100%; height: 200px; object-fit: cover; border-radius: 3px;" alt="{{ image.title|default:'Image' }}">
            {% if image.title %}
            <div class="card-header text-center">{{ image.title }}</div>
            {% endif %}
            <div class="card-footer text-center">
                <a href="{% url 'edit_gallery' image.id %}" class="btn btn-sm btn-warning">✏️ Edit</a>
                <a href="{% url 'delete_gallery' image.id %}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Are you sure you want to delete this image?')">🗑️ Delete</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted text-center">No gallery images uploaded yet.</p>
    {% endfor %}
</div>
{% endblock %}
