{% extends 'admin_dashboard/base.html' %}
{% block content %}
<div class="container mt-0">
    <h2 class="mb-4 text-center">Edit Contact Information</h2>
    <div class="card p-4 shadow-sm">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <p class="text-muted">For emails, enter multiple addresses separated by commas (e.g., info@bmd.gov.bd,journal@bmd.gov.bd).</p>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
