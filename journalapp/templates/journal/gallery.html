{% extends "journal/base.html" %}

{% block content %}
<h2 class="text-center">Gallery</h2>
<div class="gallery-container" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; border:2px solid black; padding:5px; border-radius: 5px;">
  {% for image in gallery_images %}
    <div class="gallery-item" style="width: 250px;">
      <img src="{{ image.image.url }}" alt="Gallery Image" style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px;">
       {% if image.title %}
        <div class=" d-none d-md-block bg-info bg-opacity-50 rounded">
            <h5>{{ image.title }}</h5>
        </div>
        {% endif %}
    </div>
  {% endfor %}
</div>
{% endblock %}
